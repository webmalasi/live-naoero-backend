# Naoero Laravel backend over https. The NAB payment page (Unified
# Checkout) only runs on an https origin, so the shop's pay page and the
# whole API are also served here. Certificate: Let's Encrypt (certbot,
# webroot /var/www/certbot, renewed automatically).
server {
    listen 80;
    listen [::]:80;
    server_name naoero.37.60.224.111.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name naoero.37.60.224.111.nip.io;

    ssl_certificate /etc/letsencrypt/live/naoero.37.60.224.111.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naoero.37.60.224.111.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:naoero_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/naoero-laravel/public;
    index index.php;
    charset utf-8;
    client_max_body_size 3m;

    access_log /var/log/nginx/naoero-laravel.access.log;
    error_log /var/log/nginx/naoero-laravel.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9020;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_read_timeout 190s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
