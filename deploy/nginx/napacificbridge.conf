# napacificbridge.info: the Naoero Airlines website and backend.
#
#   https://napacificbridge.info       website (static Next.js export in
#                                      /var/www/napacificbridge.info/public_html)
#   https://www.napacificbridge.info   redirects to https://napacificbridge.info
#   https://api.napacificbridge.info   Naoero Laravel backend: website content API
#                                      (/api), app API (/api/v1), admin panel,
#                                      shop payment pages, storage files
#
# Certificates: Let's Encrypt (certbot, webroot /var/www/certbot), renewed
# automatically; nginx reloads after each renewal.
# naoero.37.60.224.111.nip.io (naoero-https.conf) still serves the backend as
# a fallback for app builds that use it.

# http: Let's Encrypt only; everything else goes to https.
server {
    listen 80;
    listen [::]:80;
    server_name napacificbridge.info www.napacificbridge.info api.napacificbridge.info;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.napacificbridge.info;

    ssl_certificate /etc/letsencrypt/live/api.napacificbridge.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.napacificbridge.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:napacific_api_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/naoero-laravel/public;
    index index.php;
    charset utf-8;
    # Admin uploads go up to 20 MB (documents); PHP allows 20 MB per file.
    client_max_body_size 25m;

    access_log /var/log/nginx/naoero-laravel.access.log;
    error_log /var/log/nginx/naoero-laravel.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9020;
        # Paths inside the container.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;
        # The client's real address, not one it claims.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        # Bookings and payments can wait on the airline for over a minute.
        fastcgi_read_timeout 190s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ---------------------------------------------------------------- website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.napacificbridge.info;

    ssl_certificate /etc/letsencrypt/live/napacificbridge.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/napacificbridge.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:napacific_web_ssl:10m;

    return 301 https://napacificbridge.info$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name napacificbridge.info;

    ssl_certificate /etc/letsencrypt/live/napacificbridge.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/napacificbridge.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:napacific_web_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/napacificbridge.info/public_html;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/napacificbridge.access.log;
    error_log /var/log/nginx/napacificbridge.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Hashed build files never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages from earlier versions of the site, for old links and bookmarks:
    # gift cards and merchandise moved from /gift-cards to /shop.
    location ~ ^/gift-cards(/.*)?$ {
        return 301 /shop$1;
    }
    location ~ ^/about-old/?$ {
        return 301 /about/;
    }

    # Every page is a folder with an index.html (trailingSlash export):
    # /about -> /about/, unknown pages -> the site's 404 page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
