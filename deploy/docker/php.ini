; Bookings can wait up to a minute for a partner airline, payments up to
; 30 seconds for tickets: allow for that plus the Zenith call itself.
max_execution_time = 180
memory_limit = 256M
post_max_size = 25M
; Admin uploads: images up to 10 MB, documents up to 20 MB (nginx allows 25 MB).
upload_max_filesize = 20M
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
