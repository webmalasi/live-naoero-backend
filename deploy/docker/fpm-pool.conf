; The container shares the host network: listen on loopback only; nginx
; on the host passes requests here.
[www]
listen = 127.0.0.1:9020
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
request_terminate_timeout = 190s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
